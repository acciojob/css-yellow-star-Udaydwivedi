
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CSS Star</title>

  <style>
    body {
      margin: 0;
      background: #eee;
    }

    .star {
      position: relative;
      width: 0;
      height: 0;
      margin: 40px;
      border-left: 50px solid transparent;
      border-right: 50px solid transparent;
      border-bottom: 100px solid yellow;
    }

    .star::before {
      content: "";
      position: absolute;
      top: 30px;
      left: -50px;
      width: 0;
      height: 0;
      border-left: 50px solid transparent;
      border-right: 50px solid transparent;
      border-top: 100px solid yellow;
    }
  </style>
</head>

<body>
  <div class="star"></div>
</body>
</html>
